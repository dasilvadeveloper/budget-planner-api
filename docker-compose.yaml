services:
  postgres:
    image: postgres:17
    container_name: budget-planner-db
    environment:
      POSTGRES_DB: budget_planner
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d budget_planner" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    image: budget-planner-api
    container_name: budget-planner-api
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/budget_planner
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
