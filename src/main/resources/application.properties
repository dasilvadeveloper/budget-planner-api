spring.application.name=budget-planner-api
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budget-planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0
security.jwt.token.secret=${JWT_SECRET} 
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200} 
server.forward-headers-strategy=framework
